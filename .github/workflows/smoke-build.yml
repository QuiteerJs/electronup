name: Smoke Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: build --dir on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build electronup CLI
        run: pnpm --filter electronup build

      - name: Run unit tests
        run: pnpm --filter electronup test

      - name: Smoke build ( dir target , current platform )
        working-directory: playground/electronup-test
        run: pnpm exec electronup build --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert unpacked app exists
        shell: bash
        working-directory: playground/electronup-test
        run: |
          ls -R dist/out
          case "${{ runner.os }}" in
            Windows) test -f dist/out/win-unpacked/electronup-test.exe ;;
            macOS)   test -d dist/out/mac-*/electronup-test.app ;;
            Linux)   test -x dist/out/linux-unpacked/electronup-test ;;
            *) echo "unknown runner os" && exit 1 ;;
          esac
          echo "smoke build OK : ${{ runner.os }}"
