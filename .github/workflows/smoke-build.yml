name: Smoke Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ( all packages )
        run: pnpm typecheck

      # lint 会检查 playground , 其中 import 'electronup' 的类型来自构建产物 , 需先构建
      - name: Build electronup CLI
        run: pnpm --filter electronup build

      # electron-preload 的 index.d.cts 与 modules-smoke 的类型引用 dist , 同样需先构建
      - name: Build electron-* modules
        run: pnpm modules:build

      - name: Lint
        run: pnpm lint

      - name: Run unit tests ( all packages )
        run: pnpm test

      # 真实拉取 electronup-template 各分支校验与 electronup 的约定 ; 模板仓库独立演进 , 失败只提示不阻塞
      - name: Check create-electronup remote templates
        continue-on-error: true
        run: pnpm --filter create-electronup exec vp test run templates.remote
        env:
          CREATE_ELECTRONUP_REMOTE: '1'

  modules-e2e:
    name: electron-* modules e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 默认限制非特权 user namespace , Chromium 沙箱无法启动 ; 放开后不必给 electron 加 --no-sandbox
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build electron-* modules
        run: pnpm modules:build

      # 真 Electron 跑一遍示例 : 页面自检通过才以 0 退出
      - name: playground/modules-basic smoke
        run: xvfb-run -a pnpm --filter @quiteer/playground-basic smoke

      - name: playground/modules-smoke e2e ( playwright )
        run: xvfb-run -a pnpm test:e2e:modules

  dev-e2e:
    name: electronup dev e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build electronup CLI
        run: pnpm --filter electronup build

      # electronup-test 的主进程引用了 workspace 的 electron-ipc
      - name: Build electron-* modules
        run: pnpm modules:build

      # 真 Electron 跑 electronup dev : env / mode、改主进程与 preload 后重启
      - name: electronup dev e2e
        run: xvfb-run -a pnpm test:e2e:dev

  smoke:
    name: build --dir on ${{ matrix.os }}
    env:
      ELECTRONUP_UPDATE_URL: http://127.0.0.1:18080/updates/
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build electronup CLI
        run: pnpm --filter electronup build

      # electronup-test 把 workspace 的 electron-ipc 打进主进程 , 需要先有它的 dist
      - name: Build electron-* modules
        run: pnpm modules:build

      - name: Run unit tests ( all packages )
        run: pnpm test

      - name: Check packed core package
        shell: bash
        run: |
          mkdir -p template/release-check/archive template/release-check/extracted
          pnpm --filter electronup pack --pack-destination "$PWD/template/release-check/archive"
          tar -xf template/release-check/archive/electronup-*.tgz -C template/release-check/extracted
          node .github/scripts/check-release-package.mjs template/release-check/extracted/package

      - name: Smoke build ( dir target , current platform )
        working-directory: playground/electronup-test
        run: node ../../packages/electronup/dist/bin/electronup.mjs build --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert unpacked app exists
        shell: bash
        working-directory: playground/electronup-test
        run: |
          ls -R dist/out
          case "${{ runner.os }}" in
            Windows) test -f dist/out/win-unpacked/electronup-test.exe ;;
            # mac 输出目录随 runner 架构为 mac/ ( x64 ) 或 mac-arm64/ ( arm64 )
            macOS)   test -d dist/out/mac*/electronup-test.app ;;
            Linux)   test -x dist/out/linux-unpacked/electronup-test ;;
            *) echo "unknown runner os" && exit 1 ;;
          esac
          echo "smoke build OK : ${{ runner.os }}"

      # electron-ipc 放在 dependencies 且是纯 ESM , 必须被打进 electron.cjs , 不能留成运行期 require
      - name: Assert import-only dependencies are bundled
        shell: bash
        working-directory: playground/electronup-test
        run: |
          if grep -q 'require("@quiteer/electron-ipc")' dist/resource/electron.cjs; then
            echo "electron.cjs still requires the ESM-only @quiteer/electron-ipc" && exit 1
          fi

      - name: Assert packaged updater dependencies
        shell: bash
        working-directory: playground/electronup-test
        run: |
          case "${{ runner.os }}" in
            Windows) resources=(dist/out/win-unpacked/resources) ;;
            macOS)   resources=(dist/out/mac*/electronup-test.app/Contents/Resources) ;;
            Linux)   resources=(dist/out/linux-unpacked/resources) ;;
            *) exit 1 ;;
          esac
          node ../../.github/scripts/check-updater-package.mjs "${resources[0]}"

      # --dir 只在 Linux 写入 app-update.yml ; 各平台都构建一次支持自动更新的安装包 , 才能验证更新源与元数据
      - name: Build update artifacts ( installer target , current platform )
        shell: bash
        working-directory: playground/electronup-test
        run: |
          case "${{ runner.os }}" in
            Windows) target=(--win x64) ;;
            macOS)   target=(--mac) ;;
            Linux)   target=(--linux x64) ;;
            *) exit 1 ;;
          esac
          node ../../packages/electronup/dist/bin/electronup.mjs build "${target[@]}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert update source and metadata
        shell: bash
        working-directory: playground/electronup-test
        run: |
          ls dist/out
          case "${{ runner.os }}" in
            Windows) resources=(dist/out/win-unpacked/resources) metadata=dist/out/latest.yml ;;
            macOS)   resources=(dist/out/mac*/electronup-test.app/Contents/Resources) metadata=dist/out/latest-mac.yml ;;
            Linux)   resources=(dist/out/linux-unpacked/resources) metadata=dist/out/latest-linux.yml ;;
            *) exit 1 ;;
          esac
          node ../../.github/scripts/check-updater-package.mjs "${resources[0]}" "$ELECTRONUP_UPDATE_URL" "$metadata"

  sign-smoke:
    name: signed build with self-signed cert (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build electronup CLI
        run: pnpm --filter electronup build

      # electronup-test 把 workspace 的 electron-ipc 打进主进程 , 需要先有它的 dist
      - name: Build electron-* modules
        run: pnpm modules:build

      - name: Generate self-signed code signing certificate
        shell: powershell
        run: |
          $pfxPass = ConvertTo-SecureString 'electronup-smoke' -AsPlainText -Force
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=electronup-smoke' -CertStoreLocation Cert:\CurrentUser\My
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP/electronup-smoke.pfx" -Password $pfxPass | Out-Null

      - name: Signed smoke build ( dir target )
        working-directory: playground/electronup-test
        run: node ../../packages/electronup/dist/bin/electronup.mjs build --dir
        env:
          CSC_LINK: ${{ runner.temp }}/electronup-smoke.pfx
          CSC_KEY_PASSWORD: electronup-smoke

      - name: Assert the packaged executable is signed
        shell: powershell
        working-directory: playground/electronup-test
        run: |
          $sig = Get-AuthenticodeSignature 'dist/out/win-unpacked/electronup-test.exe'
          if ($null -eq $sig.SignerCertificate) { throw "expected a signed executable, got status: $($sig.Status)" }
          Write-Host "Authenticode status: $($sig.Status)"
