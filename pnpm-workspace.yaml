shellEmulator: true

trustPolicy: no-downgrade
# semver@6.3.1 为 @electron/get 的合法依赖 , 发布时未附 provenance 被 no-downgrade 误判
trustPolicyExclude:
  - semver@6.3.1

packages:
  - packages/*
  - playground/*
  - template

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

onlyBuiltDependencies:
  - electron
  - esbuild
  - simple-git-hooks
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
