shellEmulator: true

trustPolicy: no-downgrade

packages:
  - packages/*
  - playground/*
  - template

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

onlyBuiltDependencies:
  - electron
  - esbuild
  - simple-git-hooks
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
